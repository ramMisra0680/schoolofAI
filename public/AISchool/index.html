<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>*{margin:0;padding:0;box-sizing:border-box}</style>
</head>
<body>
<title>India School of AI · NASSCOM FutureSkills</title>
<style>
  :root {
    --ink: #171A2B; --ink-soft: #565C77; --ink-faint: #8A90AB;
    --glass: rgba(255,255,255,0.55);
    --glass-2: rgba(255,255,255,0.72);
    --glass-line: rgba(255,255,255,0.75);
    --glass-line-2: rgba(23,26,43,0.08);
    --shadow: 0 2px 6px rgba(23,26,43,.06), 0 22px 48px -20px rgba(23,26,43,.28);
    --shadow-soft: 0 1px 3px rgba(23,26,43,.05), 0 10px 24px -14px rgba(23,26,43,.20);
    --primary: #5B4BE0; --primary-2: #7C6BF5;
    --saffron: #E88A2E;
    --good: #1FA36B; --warn: #D98A2B; --crit: #D8493F;
    --bg-base: #EAEDF9;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", sans-serif;
    --mono: "SF Mono", "Cascadia Code", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    --b1:#6E5BF0; --b2:#2FB6C4; --b3:#E88A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #EEF0FA; --ink-soft: #A7ADCB; --ink-faint: #6C7194;
      --glass: rgba(24,28,46,0.55); --glass-2: rgba(30,35,56,0.66);
      --glass-line: rgba(255,255,255,0.12); --glass-line-2: rgba(255,255,255,0.06);
      --shadow: 0 2px 6px rgba(0,0,0,.4), 0 26px 54px -22px rgba(0,0,0,.7);
      --shadow-soft: 0 1px 3px rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.6);
      --primary: #8878FF; --primary-2: #9F91FF; --saffron: #F0A24B;
      --good: #37C089; --warn: #E4A559; --crit: #E86B62;
      --bg-base: #080B18;
      --b1:#6E5BF0; --b2:#1F8C99; --b3:#C9721F;
    }
  }
  :root[data-theme="light"]{--ink:#171A2B;--ink-soft:#565C77;--ink-faint:#8A90AB;--glass:rgba(255,255,255,0.55);--glass-2:rgba(255,255,255,0.72);--glass-line:rgba(255,255,255,0.75);--glass-line-2:rgba(23,26,43,0.08);--primary:#5B4BE0;--primary-2:#7C6BF5;--saffron:#E88A2E;--good:#1FA36B;--warn:#D98A2B;--crit:#D8493F;--bg-base:#EAEDF9;--b1:#6E5BF0;--b2:#2FB6C4;--b3:#E88A2E;--shadow:0 2px 6px rgba(23,26,43,.06),0 22px 48px -20px rgba(23,26,43,.28);--shadow-soft:0 1px 3px rgba(23,26,43,.05),0 10px 24px -14px rgba(23,26,43,.20);}
  :root[data-theme="dark"]{--ink:#EEF0FA;--ink-soft:#A7ADCB;--ink-faint:#6C7194;--glass:rgba(24,28,46,0.55);--glass-2:rgba(30,35,56,0.66);--glass-line:rgba(255,255,255,0.12);--glass-line-2:rgba(255,255,255,0.06);--primary:#8878FF;--primary-2:#9F91FF;--saffron:#F0A24B;--good:#37C089;--warn:#E4A559;--crit:#E86B62;--bg-base:#080B18;--b1:#6E5BF0;--b2:#1F8C99;--b3:#C9721F;--shadow:0 2px 6px rgba(0,0,0,.4),0 26px 54px -22px rgba(0,0,0,.7);--shadow-soft:0 1px 3px rgba(0,0,0,.35),0 12px 28px -16px rgba(0,0,0,.6);}

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); color: var(--ink); background: var(--bg-base);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  /* ambient gradient backdrop for glass to read against */
  .ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .blob.a { width: 520px; height: 520px; background: var(--b1); top: -140px; left: -80px; }
  .blob.b { width: 480px; height: 480px; background: var(--b2); bottom: -160px; right: -60px; opacity: .5; }
  .blob.c { width: 420px; height: 420px; background: var(--b3); top: 40%; left: 45%; opacity: .38; }
  @media (prefers-color-scheme: dark) { .blob { opacity: .4; } .blob.c { opacity: .3; } }

  .app { height: 100vh; display: flex; flex-direction: column; }

  /* top bar */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 14px 26px; flex: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(150deg, var(--primary-2), var(--primary));
    box-shadow: 0 6px 16px -6px var(--primary);
  }
  .brand .bt { line-height: 1.15; }
  .brand .bn { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
  .brand .bs { font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); }
  .brand .bs b { color: var(--saffron); font-weight: 600; }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .glass {
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
    box-shadow: var(--shadow);
  }
  .roleseg { display: inline-flex; border-radius: 11px; padding: 4px; gap: 2px; }
  .roleseg button {
    border: 0; background: transparent; cursor: pointer; font-family: var(--sans);
    color: var(--ink-soft); font-size: 0.82rem; font-weight: 600; padding: 7px 15px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 7px; transition: color .2s;
  }
  .roleseg button.on { background: linear-gradient(150deg, var(--primary-2), var(--primary)); color: #fff; box-shadow: 0 5px 14px -6px var(--primary); }
  .roleseg button:not(.on):hover { color: var(--ink); }
  .who { display: flex; align-items: center; gap: 9px; padding: 5px 12px 5px 6px; border-radius: 999px; }
  .who .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; color: #fff; background: linear-gradient(140deg, var(--saffron), #d06b1e); }
  .who .nm { font-size: 0.82rem; font-weight: 650; line-height: 1.1; }
  .who .rl { font-size: 0.66rem; color: var(--ink-faint); }
  .iconbtn { width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: var(--ink-soft); }
  .iconbtn:hover { color: var(--ink); }

  /* three-zone grid, generous gaps */
  .grid {
    flex: 1; display: grid; grid-template-columns: 268px minmax(0,1fr) 340px;
    gap: 34px; padding: 8px 30px 30px; min-height: 0;
  }

  .panel { border-radius: 22px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-head { padding: 18px 20px 12px; flex: none; }
  .panel-head .eyebrow { font-family: var(--mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.13em; color: var(--ink-faint); }
  .panel-head .h { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; margin-top: 3px; }
  .scroll { overflow-y: auto; min-height: 0; }
  .scroll::-webkit-scrollbar { width: 8px; } .scroll::-webkit-scrollbar-thumb { background: var(--glass-line-2); border-radius: 8px; }

  /* left nav */
  .navsec { padding: 4px 12px 10px; }
  .navsec .lab { font-family: var(--mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); padding: 8px 8px 6px; }
  .navitem {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: 0; cursor: pointer; font-family: var(--sans);
    color: var(--ink); font-size: 0.85rem; padding: 8px 10px; border-radius: 10px; transition: background .16s;
  }
  .navitem:hover { background: var(--glass-2); }
  .navitem.on { background: var(--glass-2); box-shadow: inset 3px 0 0 var(--primary); }
  .navitem .ni-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .navitem .ni-ic svg { width: 14px; height: 14px; }
  .navitem .ni-b { flex: 1; min-width: 0; }
  .navitem .ni-t { font-weight: 550; }
  .navitem .ni-s { font-size: 0.7rem; color: var(--ink-faint); }
  .navitem .score { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .score.hi { color: var(--good); } .score.mid { color: var(--warn); } .score.lo { color: var(--crit); }
  .avatar-sm { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.64rem; font-weight: 700; color: #fff; flex: none; }

  /* middle conversation */
  .conv { position: relative; }
  .conv-scroll { padding: 8px 22px 12px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 11px; max-width: 92%; animation: rise .35s ease both; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .m-av { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 0.62rem; font-weight: 700; }
  .msg.bot .m-av { background: linear-gradient(150deg, var(--primary-2), var(--primary)); }
  .msg.user .m-av { background: linear-gradient(140deg, var(--saffron), #d06b1e); }
  .bubble { border-radius: 16px; padding: 12px 15px; font-size: 0.9rem; line-height: 1.5; }
  .msg.bot .bubble { background: var(--glass-2); border: 1px solid var(--glass-line); border-top-left-radius: 5px; }
  .msg.user .bubble { background: linear-gradient(150deg, var(--primary-2), var(--primary)); color: #fff; border-top-right-radius: 5px; }
  .bubble p { margin: 0 0 6px; } .bubble p:last-child { margin: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* rich cards inside conversation */
  .rc { margin-top: 10px; border-radius: 14px; overflow: hidden; border: 1px solid var(--glass-line-2); background: var(--glass-2); }
  .rc-h { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--glass-line-2); }
  .rc-h .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .rc-h .ic svg { width: 14px; height: 14px; }
  .rc-h .t { font-weight: 650; font-size: 0.86rem; } .rc-h .s { font-size: 0.7rem; color: var(--ink-faint); }
  .rc-b { padding: 12px 14px; font-size: 0.84rem; }
  .qz { padding: 10px 0; border-top: 1px dashed var(--glass-line-2); }
  .qz:first-child { border-top: 0; padding-top: 2px; }
  .qz .q { font-weight: 600; margin-bottom: 6px; }
  .qz .opts { display: grid; gap: 5px; }
  .qopt { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-soft); }
  .qopt .k { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--glass-line-2); display: grid; place-items: center; font-size: 0.66rem; font-weight: 700; flex: none; }
  .qopt.correct { color: var(--good); font-weight: 600; } .qopt.correct .k { background: var(--good); color: #fff; border-color: var(--good); }
  .rowline { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--glass-line-2); }
  .rowline:first-child { border-top: 0; }
  .rowline .rl-b { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .rowline .rl-m { margin-left: auto; font-family: var(--mono); font-size: 0.76rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .plan-step { display: flex; gap: 11px; padding: 9px 0; border-top: 1px solid var(--glass-line-2); }
  .plan-step:first-child { border-top: 0; }
  .plan-step .n { width: 22px; height: 22px; border-radius: 7px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; flex: none; }
  .plan-step .pt { font-weight: 600; font-size: 0.83rem; } .plan-step .pd { font-size: 0.75rem; color: var(--ink-faint); }
  .fit { display: flex; align-items: center; gap: 14px; }
  .ring { width: 62px; height: 62px; flex: none; }
  .fit .fr { font-size: 0.8rem; color: var(--ink-soft); }
  .fit .fr b { color: var(--ink); }
  .stickyrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .snote {
    width: 128px; padding: 10px 11px; border-radius: 10px; font-size: 0.74rem; line-height: 1.35;
    background: linear-gradient(160deg, #FFF3C4, #FFE7A0); color: #4a3d10; position: relative; box-shadow: var(--shadow-soft);
    transform: rotate(-1.4deg);
  }
  .snote:nth-child(2n) { transform: rotate(1.2deg); background: linear-gradient(160deg,#D6F5D0,#B9EDB2); color: #17401a; }
  .snote:nth-child(3n) { transform: rotate(.6deg); background: linear-gradient(160deg,#D6E4FF,#B9CCF7); color: #14264a; }
  .snote .dl { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 6px; background: rgba(0,0,0,.14); border: 0; cursor: pointer; display: grid; place-items: center; color: inherit; }
  .snote .st { font-weight: 700; display: block; margin-bottom: 3px; }
  .rc-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--glass-line-2); }
  .abtn { border: 0; cursor: pointer; font-family: var(--sans); font-weight: 600; font-size: 0.78rem; padding: 8px 13px; border-radius: 9px; background: var(--primary); color: #fff; transition: filter .2s, transform .1s; }
  .abtn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .abtn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--glass-line-2); }
  .abtn.ghost:hover { color: var(--ink); }
  .traced { font-family: var(--mono); font-size: 0.64rem; color: var(--ink-faint); margin-top: 9px; display: flex; align-items: center; gap: 6px; }

  /* middle ask bar */
  .askbar { flex: none; padding: 12px 18px 16px; }
  .ask { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 9px 9px 9px 15px; background: var(--glass-2); border: 1px solid var(--glass-line); }
  .ask:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 20%, transparent); }
  .ask input { flex: 1; border: 0; background: transparent; outline: none; color: var(--ink); font-family: var(--sans); font-size: 0.92rem; }
  .ask input::placeholder { color: var(--ink-faint); }
  .ask .go { border: 0; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(150deg, var(--primary-2), var(--primary)); color: #fff; display: grid; place-items: center; flex: none; transition: transform .1s, filter .2s; }
  .ask .go:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .quickrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .qchip { font-size: 0.76rem; color: var(--ink-soft); background: transparent; border: 1px solid var(--glass-line-2); border-radius: 999px; padding: 6px 11px; cursor: pointer; transition: color .2s, border-color .2s; }
  .qchip:hover { color: var(--ink); border-color: var(--primary); }

  /* right: iOS glass dashboard widgets — content top, ask below */
  .space { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; min-height: 0; padding-right: 4px; padding-bottom: 6px; }
  .space::-webkit-scrollbar { width: 8px; } .space::-webkit-scrollbar-thumb { background: var(--glass-line-2); border-radius: 8px; }
  .widget { border-radius: 20px; overflow: hidden; flex: none; }
  .wg-top { padding: 15px 16px 13px; }
  .wg-h { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .wg-h .wic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: 0 4px 10px -4px rgba(0,0,0,.3); }
  .wg-h .wic svg { width: 16px; height: 16px; }
  .wg-h .wt { font-weight: 700; font-size: 0.9rem; letter-spacing: -0.01em; }
  .wg-h .wtag { margin-left: auto; font-family: var(--mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .wtag.good { color: var(--good); } .wtag.warn { color: var(--warn); }
  .bigstat { display: flex; align-items: baseline; gap: 8px; }
  .bigstat .v { font-size: 1.9rem; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .bigstat .d { font-size: 0.76rem; font-weight: 650; } .bigstat .d.up { color: var(--good); }
  .substat { font-size: 0.74rem; color: var(--ink-faint); margin-top: 6px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 42px; margin-top: 12px; }
  .bars i { flex: 1; border-radius: 3px 3px 0 0; background: color-mix(in srgb, var(--primary) 32%, transparent); display: block; }
  .bars i.hot { background: linear-gradient(180deg, var(--primary-2), var(--primary)); }
  .minirow { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 0.8rem; }
  .minirow + .minirow { border-top: 1px solid var(--glass-line-2); }
  .minirow .mr-av { width: 24px; height: 24px; border-radius: 50%; font-size: 0.6rem; font-weight: 700; color: #fff; display: grid; place-items: center; flex: none; }
  .minirow .mr-m { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; }
  /* ask-below strip */
  .wg-ask { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-top: 1px solid var(--glass-line-2); background: color-mix(in srgb, var(--glass-2) 80%, transparent); }
  .wg-ask svg { width: 15px; height: 15px; color: var(--primary); flex: none; }
  .wg-ask input { flex: 1; border: 0; background: transparent; outline: none; color: var(--ink); font-family: var(--sans); font-size: 0.78rem; }
  .wg-ask input::placeholder { color: var(--ink-faint); }
  .wg-ask .wsend { border: 0; background: transparent; cursor: pointer; color: var(--ink-faint); display: grid; place-items: center; padding: 2px; }
  .wg-ask .wsend:hover { color: var(--primary); }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 16px); background: var(--ink); color: var(--bg-base); font-size: 0.82rem; font-weight: 600; padding: 10px 16px; border-radius: 11px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 9px; opacity: 0; pointer-events: none; transition: opacity .28s, transform .28s; z-index: 80; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .tk { color: var(--primary-2); display: grid; place-items: center; }

  @media (max-width: 1040px) {
    .grid { grid-template-columns: 1fr; gap: 20px; overflow-y: auto; }
    .app { height: auto; min-height: 100vh; } body { overflow: auto; }
    .panel, .space { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; transition-duration: .001s !important; } }
</style>

<div class="app">

        <button id="roleStudent" role="tab" aria-selected="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/></svg>Student</button>

      <div class="who glass" title="Signed in"><span class="av" id="whoAv">PN</span><span><span class="nm" id="whoNm">Priya Nair</span><br><span class="rl" id="whoRl">Lead Instructor</span></span></div>
      <button class="iconbtn glass" id="themeBtn" title="Light / dark" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg></button>

  <div class="grid">
    <!-- LEFT -->
    <aside class="panel glass">
      <div class="panel-head"><div class="eyebrow" id="leftEyebrow">Cohort</div><div class="h" id="leftTitle">AI for Business · C3</div></div>

    <!-- MIDDLE: conversation -->
    <main class="panel glass conv">
      <div class="panel-head"><div class="eyebrow">Assistant</div><div class="h" id="convTitle">Ask, and it gets done</div></div>
      <div class="scroll conv-scroll" id="conv"></div>
      <div class="askbar">
        <form class="ask" id="askForm" autocomplete="off">
          <input id="askInput" placeholder="Ask anything — “generate a quiz on neural networks”…" aria-label="Ask" />
          <button class="go" type="submit" aria-label="Send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </form>
        <div class="quickrow" id="quickRow"></div>
      </div>
    </main>

    <!-- RIGHT: iOS glass dashboard widgets -->
    <aside class="space" id="space" aria-label="Your dashboards"></aside>
  </div>
</div>

<div class="toast" id="toast"><span class="tk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span><span id="toastText"></span></div>

<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.documentElement;

  var IC = {
    people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 6a3 3 0 0 1 0 6M17 15c2.5.4 4 2.3 4 5"/></svg>',
    quiz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
    report: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>',
    fit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v11l-5 5H4z"/><path d="M20 15h-5v5"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-9"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M18 3v18"/></svg>'
  };
  var AVC = ["#6E5BF0","#2F9EA8","#E88A2E","#C94B7B","#3E9B6B","#4B7BD8"];
  function initials(n){ return n.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(); }
  function avatar(n, i){ return '<span class="mr-av" style="background:'+AVC[i%AVC.length]+'">'+initials(n)+'</span>'; }
  function cls(s){ return s>=80?"hi":(s>=65?"mid":"lo"); }

  /* ---------- domain data ---------- */
  var STUDENTS = [
    { n:"Ananya Sharma", s:88, trend:[70,74,78,82,85,88], strong:"Model evaluation, Python", gap:"Deployment", course:"Applied Machine Learning", match:92 },
    { n:"Rohan Verma", s:61, trend:[68,64,60,63,59,61], strong:"Curiosity, teamwork", gap:"Python fundamentals, stats", course:"AI Foundations (revisit) + Python Lab", match:78 },
    { n:"Meera Iyer", s:79, trend:[62,66,71,74,77,79], strong:"Data storytelling", gap:"Algorithms", course:"Data Analytics for AI", match:85 },
    { n:"Karthik Rao", s:92, trend:[80,83,86,88,90,92], strong:"Math, neural nets", gap:"Communication", course:"Deep Learning Specialisation", match:95 },
    { n:"Sara Fernandes", s:55, trend:[60,58,54,56,52,55], strong:"Design thinking", gap:"Coding confidence, math", course:"AI Foundations (revisit)", match:74 }
  ];

  var space = document.getElementById("space");
  var leftNav = document.getElementById("leftNav");
  var conv = document.getElementById("conv");
  var quickRow = document.getElementById("quickRow");
  var input = document.getElementById("askInput");
  var role = "teacher";

  /* ---------- helpers to build rich cards ---------- */
  function tracedLine(src){ return '<div class="traced"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/></svg>traced from '+src+'</div>'; }

  function quizCard(topic) {
    topic = topic || "Neural Networks";
    var qs = [
      { q:"1. Which function most commonly introduces non-linearity in a hidden layer?", o:[["A","Mean-squared error"],["B","ReLU"],["C","Softmax over inputs"],["D","Gradient clipping"]], c:1 },
      { q:"2. “Epoch” in training refers to…", o:[["A","One weight update"],["B","One full pass over the training set"],["C","The learning rate schedule"],["D","A layer of neurons"]], c:1 },
      { q:"3. Overfitting is best spotted by…", o:[["A","High train + high test accuracy"],["B","Low train + low test accuracy"],["C","High train but low test accuracy"],["D","A large batch size"]], c:2 }
    ];
    var body = qs.map(function(x){
      var opts = x.o.map(function(o,i){ return '<div class="qopt'+(i===x.c?" correct":"")+'"><span class="k">'+o[0]+'</span>'+o[1]+'</div>'; }).join("");
      return '<div class="qz"><div class="q">'+x.q+'</div><div class="opts">'+opts+'</div></div>';
    }).join("");
    return '<div class="rc cat"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#7C6BF5,#5B4BE0)">'+IC.quiz+'</span><div><div class="t">Quiz · '+topic+'</div><div class="s">10 questions · auto-graded · 3 shown</div></div></div><div class="rc-b">'+body+'</div><div class="rc-actions"><button class="abtn" data-toast="Quiz assigned to AI for Business · C3">Assign to class</button><button class="abtn ghost" data-toast="Quiz saved to your library">Save</button></div></div>'+tracedLine("Course syllabus · Module 4");
  }

  function sessionCard() {
    var steps = [
      ["Session 7 · Mon","Neural networks — intuition + live demo. Hands-on: build a 2-layer net."],
      ["Session 8 · Wed","Training & overfitting. Lab: regularisation on a real dataset."],
      ["Session 9 · Fri","Mini-project checkpoint + peer review. Rohan & Sara: extra clinic."]
    ];
    var body = steps.map(function(s,i){ return '<div class="plan-step"><span class="n">'+(i+1)+'</span><div><div class="pt">'+s[0]+'</div><div class="pd">'+s[1]+'</div></div></div>'; }).join("");
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#43C0CE,#2F9EA8)">'+IC.plan+'</span><div><div class="t">Next 3 sessions</div><div class="s">Paced to the cohort’s current level</div></div></div><div class="rc-b">'+body+'</div><div class="rc-actions"><button class="abtn" data-toast="Sessions added to the cohort calendar">Add to calendar</button><button class="abtn ghost" data-toast="Shared with co-instructors">Share</button></div></div>'+tracedLine("Performance trends · syllabus");
  }

  function fitCard(st) {
    st = st || STUDENTS[0];
    var c = st.match, circ = 2*Math.PI*26, off = circ*(1-c/100);
    var ring = '<svg class="ring" viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" fill="none" stroke="var(--glass-line-2)" stroke-width="6"/><circle cx="31" cy="31" r="26" fill="none" stroke="var(--primary)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 31 31)"/><text x="31" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">'+c+'%</text></svg>';
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#F0A24B,#E88A2E)">'+IC.fit+'</span><div><div class="t">Best-fit course · '+st.n.split(" ")[0]+'</div><div class="s">Matched to strengths &amp; gaps</div></div></div><div class="rc-b"><div class="fit">'+ring+'<div class="fr"><b>'+st.course+'</b><br>Strengths: '+st.strong+'.<br>Focus next: '+st.gap+'.</div></div></div><div class="rc-actions"><button class="abtn" data-toast="Recommendation shared with '+st.n.split(" ")[0]+'">Recommend</button></div></div>'+tracedLine("Performance history · NASSCOM course map");
  }

  function perfCard(st) {
    st = st || STUDENTS[0];
    var max = Math.max.apply(null, st.trend);
    var bars = st.trend.map(function(v,i){ var h=Math.round(v/100*100); return '<i class="'+(i===st.trend.length-1?"hot":"")+'" style="height:'+h+'%"></i>'; }).join("");
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#7C6BF5,#5B4BE0)">'+IC.chart+'</span><div><div class="t">'+st.n+' · performance</div><div class="s">Last 6 assessments</div></div></div><div class="rc-b"><div class="rowline"><span class="rl-b" style="background:var(--'+(st.s>=80?"good":st.s>=65?"warn":"crit")+')"></span>Current score<span class="rl-m">'+st.s+'/100</span></div><div class="bars" style="height:52px">'+bars+'</div><div class="rowline">Strength<span class="rl-m" style="color:var(--good)">'+st.strong+'</span></div><div class="rowline">Needs work<span class="rl-m" style="color:var(--warn)">'+st.gap+'</span></div></div><div class="rc-actions"><button class="abtn" data-ask="Draft a parent report for '+st.n.split(" ")[0]+'">Parent report</button><button class="abtn ghost" data-ask="Which course suits '+st.n.split(" ")[0]+'?">Course fit</button></div></div>'+tracedLine("Quiz scores · attendance · notes");
  }

  function reportCard(st) {
    st = st || STUDENTS[1];
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#F0A24B,#E88A2E)">'+IC.report+'</span><div><div class="t">Parent report · '+st.n+'</div><div class="s">Term 2 · plain-language summary</div></div></div><div class="rc-b"><p style="margin:0 0 8px"><b>'+st.n.split(" ")[0]+'</b> is currently at <b>'+st.s+'/100</b> in the AI for Business programme.</p><div class="rowline">Attendance<span class="rl-m" style="color:var(--good)">94%</span></div><div class="rowline">Doing well<span class="rl-m">'+st.strong+'</span></div><div class="rowline">We’re supporting<span class="rl-m" style="color:var(--warn)">'+st.gap+'</span></div><div class="rowline">Next step<span class="rl-m">'+st.course+'</span></div></div><div class="rc-actions"><button class="abtn" data-toast="Report emailed to parent/guardian">Send to parent</button><button class="abtn ghost" data-toast="Downloaded as PDF">Download PDF</button></div></div>'+tracedLine("Scores · attendance · instructor notes");
  }

  function questionsCard() {
    var qs = ["Explain the bias–variance trade-off with an example.","When would you choose a decision tree over logistic regression?","What does a confusion matrix tell you that accuracy alone does not?","Describe one ethical risk of deploying an AI model in hiring."];
    var body = qs.map(function(q,i){ return '<div class="rowline"><span class="rl-b" style="background:var(--primary)"></span>'+q+'</div>'; }).join("");
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#7C6BF5,#5B4BE0)">'+IC.quiz+'</span><div><div class="t">Test question bank</div><div class="s">Module 4 · short answer</div></div></div><div class="rc-b">'+body+'</div><div class="rc-actions"><button class="abtn" data-toast="Added to next test">Add to test</button></div></div>'+tracedLine("Question bank · Bloom levels");
  }

  function stickyCard() {
    var notes = [
      ["Gradient descent","Roll downhill: adjust weights against the slope of the error."],
      ["ReLU","max(0, x). Kills negatives, keeps it simple & fast."],
      ["Overfitting","Memorising, not learning. Watch the test gap."],
      ["Epoch vs batch","Epoch = whole set once. Batch = a handful at a time."]
    ];
    var body = notes.map(function(nt){ return '<div class="snote"><button class="dl" data-toast="Downloaded ‘'+nt[0]+'’ note" aria-label="Download"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button><span class="st">'+nt[0]+'</span>'+nt[1]+'</div>'; }).join("");
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#F0C24B,#E88A2E)">'+IC.note+'</span><div><div class="t">Sticky notes · today’s class</div><div class="s">Tap ↓ to save any note</div></div></div><div class="rc-b"><div class="stickyrow">'+body+'</div></div><div class="rc-actions"><button class="abtn" data-toast="All 4 notes downloaded">Download all</button></div></div>'+tracedLine("Session 6 · lecture notes");
  }

  function studentQuiz() {
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#43C0CE,#2F9EA8)">'+IC.quiz+'</span><div><div class="t">Practice quiz · Python basics</div><div class="s">5 questions · instant feedback</div></div></div><div class="rc-b"><div class="qz"><div class="q">1. What does <code>len([3,5,7])</code> return?</div><div class="opts"><div class="qopt"><span class="k">A</span>2</div><div class="qopt correct"><span class="k">B</span>3</div><div class="qopt"><span class="k">C</span>7</div></div></div><div class="qz"><div class="q">2. Which keyword defines a function?</div><div class="opts"><div class="qopt"><span class="k">A</span>func</div><div class="qopt correct"><span class="k">B</span>def</div><div class="qopt"><span class="k">C</span>function</div></div></div></div><div class="rc-actions"><button class="abtn" data-toast="Starting your quiz — good luck!">Start quiz</button></div></div>'+tracedLine("Your course · Python for AI");
  }

  function studentPerf() {
    var st = { n:"You", s:83, trend:[68,72,75,79,81,83], strong:"Python, data viz", gap:"Statistics" };
    var bars = st.trend.map(function(v,i){ return '<i class="'+(i===st.trend.length-1?"hot":"")+'" style="height:'+v+'%"></i>'; }).join("");
    return '<div class="rc"><div class="rc-h"><span class="ic" style="background:linear-gradient(150deg,#7C6BF5,#5B4BE0)">'+IC.chart+'</span><div><div class="t">Your progress</div><div class="s">AI Foundations · on track</div></div></div><div class="rc-b"><div class="rowline"><span class="rl-b" style="background:var(--good)"></span>Overall<span class="rl-m">83/100</span></div><div class="bars" style="height:52px">'+bars+'</div><div class="rowline">Strength<span class="rl-m" style="color:var(--good)">'+st.strong+'</span></div><div class="rowline">Focus next<span class="rl-m" style="color:var(--warn)">'+st.gap+'</span></div></div></div>'+tracedLine("Your quiz history");
  }

  /* ---------- intents ---------- */
  function respond(text) {
    var t = text.toLowerCase();
    // named student?
    var named = STUDENTS.filter(function(s){ return t.indexOf(s.n.split(" ")[0].toLowerCase()) >= 0; })[0];
    if (role === "teacher") {
      if (/quiz|test question bank/.test(t) && /question bank|test question/.test(t)) return { say:"Here’s the current test-question bank for Module 4.", card: questionsCard() };
      if (/quiz/.test(t)) { var topic = (t.match(/on ([a-z ]+)/)||[])[1]; return { say:"Done — a 10-question auto-graded quiz"+(topic?" on "+topic.trim():"")+". Preview below.", card: quizCard(topic && topic.trim()) }; }
      if (/plan|session/.test(t)) return { say:"Here’s a 3-session plan, paced to where the cohort is right now.", card: sessionCard() };
      if (/suit|fit|which course/.test(t)) return { say:"Based on "+((named?named.n.split(" ")[0]:"the")+"’s")+" strengths and gaps, this is the best next course.", card: fitCard(named) };
      if (/parent|report/.test(t)) return { say:"A plain-language parent report, ready to send.", card: reportCard(named) };
      if (/note/.test(t)) return { say:"Class notes for the last session:", card: stickyCard() };
      if (named || /performance|score|how is|doing/.test(t)) return { say:"Here’s "+(named?named.n.split(" ")[0]:"the class")+"’s performance at a glance.", card: perfCard(named) };
      return { say:"I can generate quizzes, plan sessions, draft parent reports, or recommend the right next course for any student. Try one of the chips below." };
    } else {
      if (/note|sticky/.test(t)) return { say:"Here are your sticky notes from today’s class — tap the arrow to download any one.", card: stickyCard() };
      if (/quiz|test|practice/.test(t)) return { say:"A quick practice quiz to warm up:", card: studentQuiz() };
      if (/progress|performance|score|how am i/.test(t)) return { say:"You’re on track — here’s your progress.", card: studentPerf() };
      if (/course|suit|next/.test(t)) return { say:"Given your strengths in Python and data viz, <b>Applied Machine Learning</b> is a strong next step.", card: fitCard({ n:"You", course:"Applied Machine Learning", strong:"Python, data viz", gap:"Statistics", match:87 }) };
      return { say:"I can pull your notes, quiz you, or show your progress. Pick a chip below." };
    }
  }

  /* ---------- conversation plumbing ---------- */
  function addMsg(role_, html) {
    var m = document.createElement("div");
    m.className = "msg " + role_;
    var av = role_ === "user" ? (role === "teacher" ? "PN" : "AS") : "AI";
    m.innerHTML = '<span class="m-av">'+av+'</span><div class="bubble">'+html+'</div>';
    conv.appendChild(m);
    conv.scrollTo({ top: conv.scrollHeight, behavior: reduce ? "auto" : "smooth" });
    return m;
  }
  function ask(text) {
    if (!text) return;
    addMsg("user", text.replace(/</g,"&lt;"));
    setTimeout(function () {
      var r = respond(text);
      addMsg("bot", "<p>"+r.say+"</p>" + (r.card || ""));
    }, reduce ? 20 : 340);
  }

  document.getElementById("askForm").addEventListener("submit", function (e) {
    e.preventDefault(); var v = input.value.trim(); input.value = ""; ask(v);
  });

  // delegated clicks for card actions + widget asks
  document.body.addEventListener("click", function (e) {
    var a = e.target.closest("[data-ask]"); if (a) { ask(a.getAttribute("data-ask")); return; }
    var tt = e.target.closest("[data-toast]"); if (tt) { toast(tt.getAttribute("data-toast")); return; }
    var wsend = e.target.closest(".wsend"); if (wsend) { var inp = wsend.parentElement.querySelector("input"); if (inp && inp.value.trim()) { ask(inp.value.trim()); inp.value=""; } return; }
  });
  document.body.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches(".wg-ask input")) { e.preventDefault(); if (e.target.value.trim()) { ask(e.target.value.trim()); e.target.value=""; } }
  });

  /* ---------- widgets (right, content-on-top + ask-below) ---------- */
  function widget(opts) {
    return '<section class="widget glass"><div class="wg-top"><div class="wg-h"><span class="wic" style="background:'+opts.grad+'">'+opts.ic+'</span><span class="wt">'+opts.title+'</span>'+(opts.tag?'<span class="wtag '+opts.tagcls+'">'+opts.tag+'</span>':'')+'</div>'+opts.body+'</div>'+
      '<div class="wg-ask">'+IC.spark+'<input placeholder="'+opts.ask+'" aria-label="Ask about '+opts.title+'"/><button class="wsend" aria-label="Send"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div></section>';
  }

  function renderSpace() {
    if (role === "teacher") {
      var classBars = [72,68,74,79,76,81,84];
      var barsHTML = classBars.map(function(v,i){ return '<i class="'+(i===classBars.length-1?"hot":"")+'" style="height:'+v+'%"></i>'; }).join("");
      var atrisk = STUDENTS.filter(function(s){return s.s<65;});
      var arHTML = atrisk.map(function(s,i){ return '<div class="minirow">'+avatar(s.n,i+2)+'<div><div style="font-weight:600">'+s.n+'</div><div style="font-size:.7rem;color:var(--ink-faint)">'+s.gap+'</div></div><span class="mr-m score '+cls(s.s)+'">'+s.s+'</span></div>'; }).join("");
      space.innerHTML =
        widget({ title:"Class snapshot", ic:IC.chart, grad:"linear-gradient(150deg,#7C6BF5,#5B4BE0)", tag:"+3 pts", tagcls:"good",
          body:'<div class="bigstat"><span class="v">78</span><span style="color:var(--ink-faint);font-size:.8rem">avg / 100</span><span class="d up">▲ 3</span></div><div class="substat">24 enrolled · 92% completion · 2 at risk</div><div class="bars">'+barsHTML+'</div>',
          ask:"Ask about this class…" }) +
        widget({ title:"Students at risk", ic:IC.alert, grad:"linear-gradient(150deg,#E86B62,#D8493F)", tag:"2", tagcls:"warn",
          body: arHTML, ask:"How do I help them?" }) +
        widget({ title:"Course-fit picks", ic:IC.fit, grad:"linear-gradient(150deg,#F0A24B,#E88A2E)",
          body:'<div class="minirow">'+avatar("Karthik Rao",3)+'<div><div style="font-weight:600">Karthik → Deep Learning</div><div style="font-size:.7rem;color:var(--ink-faint)">95% match</div></div></div><div class="minirow">'+avatar("Sara Fernandes",4)+'<div><div style="font-weight:600">Sara → AI Foundations</div><div style="font-size:.7rem;color:var(--ink-faint)">revisit basics</div></div></div>',
          ask:"Suggest a course for…" });
    } else {
      var pb = [68,72,75,79,81,83].map(function(v,i){ return '<i class="'+(i===5?"hot":"")+'" style="height:'+v+'%"></i>'; }).join("");
      space.innerHTML =
        widget({ title:"My progress", ic:IC.chart, grad:"linear-gradient(150deg,#7C6BF5,#5B4BE0)", tag:"on track", tagcls:"good",
          body:'<div class="bigstat"><span class="v">83</span><span style="color:var(--ink-faint);font-size:.8rem">/ 100</span><span class="d up">▲ 2</span></div><div class="substat">AI Foundations · 7-day streak 🔥</div><div class="bars">'+pb+'</div>',
          ask:"How am I doing?" }) +
        widget({ title:"Sticky notes", ic:IC.note, grad:"linear-gradient(150deg,#F0C24B,#E88A2E)", tag:"4 new", tagcls:"good",
          body:'<div class="minirow"><span class="rl-b" style="width:8px;height:8px;border-radius:50%;background:var(--saffron)"></span>Gradient descent<span class="mr-m">↓</span></div><div class="minirow"><span class="rl-b" style="width:8px;height:8px;border-radius:50%;background:var(--good)"></span>ReLU<span class="mr-m">↓</span></div><div class="minirow"><span class="rl-b" style="width:8px;height:8px;border-radius:50%;background:var(--primary)"></span>Overfitting<span class="mr-m">↓</span></div>',
          ask:"Get today’s notes" }) +
        widget({ title:"Next up", ic:IC.book, grad:"linear-gradient(150deg,#43C0CE,#2F9EA8)",
          body:'<div class="minirow"><span class="rl-b" style="width:8px;height:8px;border-radius:50%;background:var(--primary)"></span>Quiz · Python basics<span class="mr-m">due Fri</span></div><div class="minirow"><span class="rl-b" style="width:8px;height:8px;border-radius:50%;background:var(--saffron)"></span>Session 7 · Neural nets<span class="mr-m">Mon</span></div>',
          ask:"Quiz me" });
    }
  }

  /* ---------- left nav ---------- */
  function renderLeft() {
    if (role === "teacher") {
      document.getElementById("leftEyebrow").textContent = "Cohort";
      document.getElementById("leftTitle").textContent = "AI for Business · C3";
      var roster = STUDENTS.map(function(s,i){
        return '<button class="navitem" data-ask="Show '+s.n.split(" ")[0]+'’s performance">'+avatar(s.n,i)+'<span class="ni-b"><span class="ni-t">'+s.n+'</span><span class="ni-s">'+(s.s<65?"needs support":s.s>=85?"top of class":"steady")+'</span></span><span class="score '+cls(s.s)+'">'+s.s+'</span></button>';
      }).join("");
      var actions = [
        ["Generate a quiz","quiz", IC.quiz, "Generate a quiz on neural networks"],
        ["Plan sessions","plan", IC.plan, "Plan the next 3 sessions"],
        ["Parent reports","report", IC.report, "Draft a parent report for Rohan"],
        ["Course fit","fit", IC.fit, "Which course suits Ananya?"],
        ["Test questions","quiz", IC.quiz, "Show the test question bank"]
      ].map(function(a){
        return '<button class="navitem" data-ask="'+a[3]+'"><span class="ni-ic" style="background:linear-gradient(150deg,var(--primary-2),var(--primary))">'+a[2]+'</span><span class="ni-b"><span class="ni-t">'+a[0]+'</span></span></button>';
      }).join("");
      leftNav.innerHTML = '<div class="navsec"><div class="lab">Students enrolled · 5 shown</div>'+roster+'</div><div class="navsec"><div class="lab">Do it for me</div>'+actions+'</div>';
    } else {
      document.getElementById("leftEyebrow").textContent = "Student";
      document.getElementById("leftTitle").textContent = "Ananya · AI Foundations";
      var courses = [["AI Foundations","in progress · 83%"],["Python for AI","new"]].map(function(c){
        return '<button class="navitem" data-ask="How am I doing?"><span class="ni-ic" style="background:linear-gradient(150deg,#43C0CE,#2F9EA8)">'+IC.book+'</span><span class="ni-b"><span class="ni-t">'+c[0]+'</span><span class="ni-s">'+c[1]+'</span></span></button>';
      }).join("");
      var mine = [
        ["My sticky notes", IC.note, "Get today’s sticky notes"],
        ["Practice quiz", IC.quiz, "Quiz me on Python basics"],
        ["My performance", IC.chart, "Show my progress"]
      ].map(function(a){
        return '<button class="navitem" data-ask="'+a[2]+'"><span class="ni-ic" style="background:linear-gradient(150deg,var(--primary-2),var(--primary))">'+a[1]+'</span><span class="ni-b"><span class="ni-t">'+a[0]+'</span></span></button>';
      }).join("");
      leftNav.innerHTML = '<div class="navsec"><div class="lab">My courses</div>'+courses+'</div><div class="navsec"><div class="lab">My space</div>'+mine+'</div>';
    }
  }

  function renderQuick() {
    var chips = role === "teacher"
      ? ["Generate a quiz on neural networks","Plan the next 3 sessions","Which course suits Ananya?","Draft a parent report for Rohan"]
      : ["Get today’s sticky notes","Quiz me on Python basics","Show my progress","Which course is next for me?"];
    quickRow.innerHTML = chips.map(function(c){ return '<button class="qchip" data-ask="'+c+'">'+c+'</button>'; }).join("");
  }

  function greet() {
    conv.innerHTML = "";
    if (role === "teacher") {
      addMsg("bot", "<p>Good morning, Priya. Your <b>AI for Business · C3</b> cohort is averaging <b>78/100</b>, up 3 points. Two students need a hand.</p><p>Ask me to build a quiz, plan sessions, draft a parent report, or recommend the right course for any student.</p>");
    } else {
      addMsg("bot", "<p>Hi Ananya 👋 You’re at <b>83/100</b> in AI Foundations with a 7-day streak. Nice work.</p><p>I can pull your sticky notes, quiz you, or show your progress — just ask.</p>");
    }
  }

  /* ---------- role switching ---------- */
  function setRole(r) {
    role = r;
    document.getElementById("roleTeacher").classList.toggle("on", r === "teacher");
    document.getElementById("roleTeacher").setAttribute("aria-selected", r === "teacher");
    document.getElementById("roleStudent").classList.toggle("on", r === "student");
    document.getElementById("roleStudent").setAttribute("aria-selected", r === "student");
    document.getElementById("whoAv").textContent = r === "teacher" ? "PN" : "AS";
    document.getElementById("whoNm").textContent = r === "teacher" ? "Priya Nair" : "Ananya Sharma";
    document.getElementById("whoRl").textContent = r === "teacher" ? "Lead Instructor" : "Student · AI Foundations";
    document.getElementById("askInput").placeholder = r === "teacher" ? "Ask anything — “generate a quiz on neural networks”…" : "Ask anything — “quiz me on Python basics”…";
    renderLeft(); renderQuick(); renderSpace(); greet();
  }
  document.getElementById("roleTeacher").addEventListener("click", function(){ setRole("teacher"); });
  document.getElementById("roleStudent").addEventListener("click", function(){ setRole("student"); });

  /* ---------- theme + toast ---------- */
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });
  function toast(txt) {
    var t = document.getElementById("toast");
    document.getElementById("toastText").textContent = txt;
    t.classList.add("show"); clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  setRole("teacher");
})();
</script>
</body>
</html>
